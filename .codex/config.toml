[mcp_servers.freee]
command = "node"
args = ["dist/mcp-entry.js"]
startup_timeout_sec = 20
tool_timeout_sec = 180
required = true
default_tools_approval_mode = "writes"

[mcp_servers.freee.tools.freee_approval_commit_action]
approval_mode = "approve"

[mcp_servers.freee.tools.freee_monthly_approval_commit_action]
approval_mode = "approve"
