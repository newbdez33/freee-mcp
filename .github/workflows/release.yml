name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer from package.json, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version and distribution
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/validate-distribution.mjs --release-version "$RELEASE_VERSION"
          npm test
          npm run package:smoke

      - name: Build release artifact and checksum
        id: artifact
        run: |
          mkdir -p release-assets
          package_json="$(npm pack --json --pack-destination release-assets)"
          package_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(value[0].filename);' <<<"$package_json")"
          package_path="release-assets/$package_name"
          checksum_path="$package_path.sha256"
          sha256sum "$package_path" > "$checksum_path"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Create or verify annotated tag
        id: tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          target_sha="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_sha" != "$target_sha" ]]; then
              echo "$tag already points to $tagged_sha, not $target_sha." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "freee-mcp $tag" "$target_sha"
            git push origin "refs/tags/$tag"
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
          PACKAGE_PATH: ${{ steps.artifact.outputs.package_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists." >&2
            exit 1
          fi
          prerelease_args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            --verify-tag \
            --title "freee-mcp $TAG_NAME" \
            --generate-notes \
            "${prerelease_args[@]}" \
            "$PACKAGE_PATH" \
            "$CHECKSUM_PATH"
